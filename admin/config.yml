backend:
  name: github
  repo: kitqgzz/biatlon-gto
  branch: main
  base_url: https://decap-proxy.biathlon-proxy.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Наши проекты (в один файл projects.json)
  - name: "projects"
    label: "Наши проекты (Главная)"
    files:
      - name: "projects_list"
        label: "Список проектов"
        file: "content/projects.json"
        fields:
          - label: "Проекты"
            name: "items"
            widget: "list"
            fields:
              - {label: "Название", name: "title", widget: "string"}
              - {label: "Картинка", name: "image", widget: "image"}
              - {label: "Описание", name: "description", widget: "text"}

  # 2. Фотографии с мероприятий (в один файл gallery.json)
  - name: "gallery_main"
    label: "Фотографии с мероприятий"
    files:
      - name: "gallery_list"
        label: "Список фото"
        file: "content/gallery.json"
        fields:
          - label: "Фотографии"
            name: "images"
            widget: "list"
            field: {label: "Фото", name: "image", widget: "image"}

  # 3. Аква биатлон (в один файл aquathlon.json)
  - name: "aquathlon_gallery"
    label: "Аква биатлон: Фото"
    files:
      - name: "aquathlon_list"
        label: "Список фото"
        file: "content/aquathlon.json"
        fields:
          - label: "Фотографии"
            name: "images"
            widget: "list"
            field: {label: "Фото", name: "image", widget: "image"}

  # 4. Школьникам (в один файл school.json)
  - name: "school_collage"
    label: "Школьникам: Коллаж"
    files:
      - name: "school_list"
        label: "Список фото"
        file: "content/school.json"
        fields:
          - label: "Фотографии"
            name: "images"
            widget: "list"
            field: {label: "Фото", name: "image", widget: "image"}

  # 5. Педагогам (в один файл teachers.json)
  - name: "teachers_collage"
    label: "Педагогам: Коллаж"
    files:
      - name: "teachers_list"
        label: "Список фото"
        file: "content/teachers.json"
        fields:
          - label: "Фотографии"
            name: "images"
            widget: "list"
            field: {label: "Фото", name: "image", widget: "image"}
