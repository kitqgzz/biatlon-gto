name: Deploy to Yandex Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Configure AWS CLI
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          echo "$YC_SA_JSON_CREDENTIALS" > /tmp/key.json
          echo "AWS_ACCESS_KEY_ID=$(jq -r .id /tmp/key.json)" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(jq -r .private_key /tmp/key.json)" >> $GITHUB_ENV

      - name: Deploy to Yandex Object Storage
        env:
          BUCKET: ${{ secrets.BUCKET }}
        run: |
          aws s3 sync ./ s3://$BUCKET/ --delete --endpoint-url=https://storage.yandexcloud.net
