name: Deploy to Yandex Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Deploy to Yandex Object Storage
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          BUCKET: ${{ secrets.BUCKET }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_S3_SIGNATURE_VERSION: s3v4
        run: |
          echo "$YC_SA_JSON_CREDENTIALS" > /tmp/key.json
          export AWS_ACCESS_KEY_ID=$(jq -r .key_id /tmp/key.json)
          export AWS_SECRET_ACCESS_KEY=$(jq -r .private_key /tmp/key.json)
          aws s3 sync ./ s3://$BUCKET/ --delete --endpoint-url=https://storage.yandexcloud.net
